
<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
</head>
<body>
    <h2>Student Information Management System</h2>

    <h3>Add Student</h3>
    <form action="/add" method="POST">
        Name: <input type="text" name="name" required>
        Department: <input type="text" name="department" required>
        <button type="submit">Add</button>
    </form>

    <hr>

    <h3>Student Records</h3>
    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Update</th>
            <th>Delete</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student[0] }}</td>
            <td colspan="2">
                <form action="/update/{{ student[0] }}" method="POST">
                    <input type="text" name="name" value="{{ student[1] }}" required>
                    <input type="text" name="department" value="{{ student[2] }}" required>
                    <button type="submit">Update</button>
                </form>
            </td>
            <td>
                <form action="/delete/{{ student[0] }}" method="POST">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
